name: PCE breadth

on:
  schedule:
    # Weekdays 18:05 UTC (~11 AM Pacific), ahead of the 1:17 PM Pacific email task.
    - cron: "5 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute breadth
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python pce_breadth.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update PCE breadth $(date -u +%Y-%m-%d)"
          git push
