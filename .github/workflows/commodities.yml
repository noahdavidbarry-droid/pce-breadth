name: Commodities snapshot

on:
  schedule:
    # Two weekday runs after the CBOT grain (1:20 PM CT) and NYMEX energy
    # (1:30 PM CT) closes, both ahead of the Warsh email task (1:17 PM Pacific).
    # The second run is a retry in case the first fails or GitHub delays it.
    - cron: "35 19 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodities
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and compute crack spread
        run: python commodities.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commodities.json data/commodities_history.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update commodities $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
